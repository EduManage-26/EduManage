<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduManage - Reset Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="icon" type="image/x-icon" href="image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f9f9ff 0%, #e7eeff 100%); min-height: 100vh; }
        .reset-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(195,198,215,0.3); }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md relative z-10 animate-slide-up">
        <div class="reset-card rounded-2xl p-8 shadow-2xl border border-[rgba(195,198,215,0.3)]">
            <div class="text-center">
                <div class="w-16 h-16 mx-auto rounded-full bg-[rgba(37,99,235,0.1)] flex items-center justify-center text-[#004ac6]">
                    <span class="material-symbols-outlined text-[36px]" style="font-variation-settings:'FILL'1;">lock_reset</span>
                </div>
                <h2 class="text-[24px] font-[600] leading-[32px] text-[#111c2d] mt-4">Reset Password</h2>
                <p class="text-[14px] font-[400] leading-[20px] text-[#505f76] mt-2">Enter your new password</p>
            </div>
            
            <form id="resetForm" class="mt-6 space-y-4" onsubmit="handleReset(event)">
                <div>
                    <label class="block text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] mb-1">New Password</label>
                    <input class="w-full bg-white/70 border border-[#c3c6d7] rounded-xl px-4 py-3 text-[14px] font-[400] leading-[20px] focus:outline-none focus:ring-2 focus:ring-[#004ac6] focus:border-transparent transition-all" type="password" placeholder="Enter new password (min 6 characters)" id="newPassword" required minlength="6" />
                    <p class="text-[10px] text-[#505f76] mt-1">Password must be at least 6 characters</p>
                </div>
                <div>
                    <label class="block text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] mb-1">Confirm Password</label>
                    <input class="w-full bg-white/70 border border-[#c3c6d7] rounded-xl px-4 py-3 text-[14px] font-[400] leading-[20px] focus:outline-none focus:ring-2 focus:ring-[#004ac6] focus:border-transparent transition-all" type="password" placeholder="Confirm new password" id="confirmPassword" required />
                </div>
                <button type="submit" class="w-full py-3.5 bg-[#004ac6] text-white rounded-xl text-[14px] font-[600] leading-[20px] hover:bg-[#2563eb] transition-all shadow-md hover:shadow-lg active:scale-[0.98]">
                    Reset Password
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-[rgba(195,198,215,0.3)] text-center">
                <a href="login.html" class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#004ac6] hover:underline">
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let resetEmail = null;

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            resetEmail = params.get('email');
            
            if (!resetEmail) {
                window.location.href = 'login.html';
                return;
            }
            
            console.log(`📧 Resetting password for: ${decodeURIComponent(resetEmail)}`);
        });

        function handleReset(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) {
                UI.showToast('Error', 'Please fill in all fields.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                UI.showToast('Error', 'Passwords do not match.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                UI.showToast('Error', 'Password must be at least 6 characters.', 'error');
                return;
            }

            const success = Auth.resetPassword(decodeURIComponent(resetEmail), newPassword);
            
            if (success) {
                UI.showToast('Success', 'Password has been reset successfully!');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                UI.showToast('Error', 'Something went wrong. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
