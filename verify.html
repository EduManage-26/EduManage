<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduManage - Verify Email</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="icon" type="image/x-icon" href="image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f9f9ff 0%, #e7eeff 100%); min-height: 100vh; }
        .verify-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(195,198,215,0.3); }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md relative z-10 animate-slide-up">
        <div class="verify-card rounded-2xl p-8 shadow-2xl border border-[rgba(195,198,215,0.3)] text-center">
            <div class="w-20 h-20 mx-auto rounded-full bg-[rgba(0,98,66,0.1)] flex items-center justify-center text-[#006242]">
                <span class="material-symbols-outlined text-[48px]" style="font-variation-settings:'FILL'1;">verified</span>
            </div>
            <h2 class="text-[24px] font-[600] leading-[32px] text-[#111c2d] mt-4">Email Verified! ✅</h2>
            <p class="text-[14px] font-[400] leading-[20px] text-[#505f76] mt-2">
                Your email has been successfully verified.
            </p>
            <p class="text-[12px] font-[400] leading-[16px] text-[#505f76] mt-4" id="userEmail"></p>

            <div class="mt-6 flex flex-col gap-3">
                <a href="login.html" class="w-full py-3 bg-[#004ac6] text-white rounded-xl text-[14px] font-[600] hover:bg-[#2563eb] transition-all">
                    Login Now
                </a>
                <a href="index.html" class="w-full py-3 bg-[#f0f3ff] text-[#505f76] rounded-xl text-[14px] font-[600] hover:bg-[#dee8ff] transition-all">
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');

            if (email) {
                const decodedEmail = decodeURIComponent(email);
                document.getElementById('userEmail').textContent = `📧 ${decodedEmail}`;

                const verified = Auth.verifyEmail(decodedEmail);
                if (verified) {
                    console.log(`✅ Email verified for ${decodedEmail}`);
                    UI.showToast('Verified!', 'Your email has been confirmed.');
                } else {
                    console.log(`❌ Email not found: ${decodedEmail}`);
                }
            } else {
                document.getElementById('userEmail').textContent = '⚠️ No email provided for verification.';
            }
        });
    </script>
</body>
</html>
