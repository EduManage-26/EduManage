<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduManage - Notifications</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="icon" type="image/x-icon" href="../image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #f9f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .sidebar-link { transition: all 0.2s ease; cursor: pointer; }
        .sidebar-link:hover { background-color: #f0f3ff; transform: translateX(4px); }
        .sidebar-link.active { background-color: rgba(37,99,235,0.1); color: #004ac6; border-left: 4px solid #004ac6; font-weight: 700; }
        .card-shadow { box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .notification-item { transition: all 0.3s ease; }
        .notification-item:hover { background-color: #f0f3ff; }
        .notification-item.unread { background-color: rgba(240,243,255,0.3); border-left: 4px solid #004ac6; }
        .notification-item.unread:hover { background-color: rgba(240,243,255,0.6); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f9f9ff] text-[#111c2d]">

<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-full w-[260px] z-50 bg-[#f9f9ff] border-r border-[#c3c6d7] shadow-sm flex flex-col py-4 gap-1">
    <div class="px-4 mb-6">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-lg bg-[#2563eb] flex items-center justify-center text-white">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">admin_panel_settings</span>
            </div>
            <div>
                <h1 class="text-[20px] font-[600] leading-[28px] text-[#004ac6]">EduManage</h1>
                <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] profile-role">Super Admin</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 px-2 space-y-1 overflow-y-auto custom-scrollbar">
        <!-- Generated by SidebarManager -->
    </nav>
    <div class="px-4 mt-auto pt-4 border-t border-[#c3c6d7]">
        <div class="flex items-center gap-3">
            <img alt="Profile" class="w-10 h-10 rounded-full border border-[#c3c6d7] object-cover profile-avatar" src="https://ui-avatars.com/api/?name=User&background=004ac6&color=fff&size=128" />
            <div>
                <p class="text-[14px] font-[400] leading-[20px] font-bold profile-name text-[#111c2d]">Loading...</p>
                <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] profile-role text-[#505f76]">Super Admin</p>
            </div>
        </div>
    </div>
</aside>

<!-- Main Content -->
<main class="ml-[260px] min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 w-full h-16 bg-[#f9f9ff] border-b border-[#c3c6d7] shadow-sm flex justify-between items-center px-6">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative w-full max-w-md">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#737686]">search</span>
                <input class="w-full bg-[#f0f3ff] border-none rounded-full py-2 pl-10 pr-4 text-[14px] font-[400] leading-[20px] focus:ring-2 focus:ring-[#2563eb] focus:ring-opacity-20 transition-all" placeholder="Search notifications..." type="text" id="notificationSearch" />
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="p-2 text-[#505f76] hover:bg-[#f0f3ff] rounded-full transition-colors relative" onclick="window.location.href='notifications.html'">
                <span class="material-symbols-outlined">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-[#ba1a1a] rounded-full notification-badge hidden"></span>
            </button>
            <div class="flex items-center gap-2 cursor-pointer hover:bg-[#f0f3ff] p-1 rounded-lg transition-colors" onclick="window.location.href='profile.html'">
                <img alt="Avatar" class="w-8 h-8 rounded-full object-cover profile-avatar" src="https://ui-avatars.com/api/?name=User&background=004ac6&color=fff&size=32" />
                <div class="hidden md:block text-left">
                    <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold leading-tight profile-name">Loading...</p>
                    <p class="text-[10px] text-[#505f76] profile-role">Super Admin</p>
                </div>
            </div>
        </div>
    </header>

    <div class="p-6 space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-[24px] font-[600] leading-[32px] text-[#111c2d]">Notifications</h2>
                <p class="text-[16px] font-[400] leading-[24px] text-[#505f76]">Stay updated with all activities.</p>
            </div>
            <button class="bg-[#004ac6] text-white px-4 py-2.5 rounded-lg text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold shadow-md hover:bg-[#2563eb] transition-all active:scale-95 flex items-center gap-2" onclick="markAllRead()">
                <span class="material-symbols-outlined text-[18px]">done_all</span> Mark All as Read
            </button>
        </div>

        <div class="bg-[#f9f9ff] rounded-xl border border-[#c3c6d7] card-shadow overflow-hidden">
            <div class="px-4 py-3 border-b border-[#c3c6d7] bg-[#f0f3ff] flex items-center justify-between">
                <div class="flex gap-2">
                    <button class="px-3 py-1 text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold text-white bg-[#004ac6] rounded-lg" onclick="filterNotifications('all')">All</button>
                    <button class="px-3 py-1 text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold text-[#505f76] hover:bg-[#f0f3ff] rounded-lg transition-colors" onclick="filterNotifications('unread')">Unread</button>
                    <button class="px-3 py-1 text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold text-[#505f76] hover:bg-[#f0f3ff] rounded-lg transition-colors" onclick="filterNotifications('messages')">Messages</button>
                </div>
                <button class="text-[#ba1a1a] text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold hover:bg-[rgba(186,26,26,0.1)] px-4 py-2 rounded-md transition-all" onclick="clearAll()">Clear All</button>
            </div>
            <div class="divide-y divide-[#c3c6d7]" id="notificationList">
                <div class="p-8 text-center text-[#505f76]">
                    <span class="material-symbols-outlined text-[48px]">notifications_off</span>
                    <p class="mt-2">Loading notifications...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-4 px-6 border-t border-[#c3c6d7] bg-[#f9f9ff]">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76]">© 2024 EduManage. All rights reserved.</p>
            <div class="flex gap-6">
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Help Center</a>
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Privacy Policy</a>
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Terms of Service</a>
            </div>
        </div>
    </footer>
</main>

<script src="../app.js"></script>
<script>
    let notificationInterval = null;

    document.addEventListener('DOMContentLoaded', function() {
        const user = Auth.getCurrentUser();
        if (!user) {
            window.location.href = '../login.html';
            return;
        }

        // ============================================================
        // 1. التأكد من وجود بيانات الإشعارات
        // ============================================================
        function ensureNotificationData() {
            const notifications = DB.get('notifications') || [];
            if (notifications.length < 10) {
                console.log('🔄 Generating notification data...');
                if (typeof generateChatAndNotificationData === 'function') {
                    generateChatAndNotificationData();
                } else {
                    // لو الدالة مش موجودة، ننشئ بيانات وهمية يدوياً
                    createManualNotifications();
                }
            }
        }

        // ============================================================
        // 2. إنشاء بيانات وهمية يدوياً (لو الدالة مش موجودة)
        // ============================================================
        function createManualNotifications() {
            const users = DB.get('users');
            const notifications = DB.get('notifications') || [];
            
            const templates = [
                { title: 'New User Registered', message: 'A new user has joined the platform.', type: 'info' },
                { title: 'School Added 🏫', message: 'A new school has been registered.', type: 'success' },
                { title: 'System Update', message: 'New features have been deployed.', type: 'info' },
                { title: 'Security Alert ⚠️', message: 'Unusual login activity detected.', type: 'warning' },
                { title: 'Subscription Renewed', message: 'A school subscription has been renewed.', type: 'success' },
                { title: 'New Message 💬', message: 'You have a new message from a contact.', type: 'message' },
                { title: 'Report Generated 📊', message: 'Monthly report has been generated.', type: 'info' },
                { title: 'Certificate Issued 🎓', message: 'A new certificate has been issued.', type: 'success' },
                { title: 'Quiz Submitted 📝', message: 'A student submitted a quiz.', type: 'info' },
                { title: 'Assignment Graded', message: 'An assignment has been graded.', type: 'success' },
                { title: 'New Course Added 📚', message: 'A new course has been added to the platform.', type: 'info' },
                { title: 'Attendance Updated', message: 'Student attendance has been updated.', type: 'info' },
                { title: 'Schedule Changed', message: 'Class schedule has been updated.', type: 'warning' },
                { title: 'Student Enrolled', message: 'A new student has been enrolled.', type: 'success' },
                { title: 'Teacher Assigned', message: 'A new teacher has been assigned to a course.', type: 'info' }
            ];

            users.forEach(user => {
                if (!user) return;
                const count = Math.floor(Math.random() * 5) + 2;
                for (let i = 0; i < count; i++) {
                    const template = templates[Math.floor(Math.random() * templates.length)];
                    notifications.push({
                        id: DB.genId(),
                        userId: user.id,
                        title: template.title,
                        message: template.message,
                        type: template.type,
                        read: i < 2 || Math.random() > 0.6,
                        timestamp: new Date(Date.now() - Math.random() * 14 * 24 * 60 * 60 * 1000).toISOString()
                    });
                }
            });

            DB.set('notifications', notifications);
            console.log('✅ Manual notifications created:', notifications.length);
        }

        // ============================================================
        // 3. تحميل الصفحة
        // ============================================================
        UI.loadUserProfile();
        
        // تأكد من وجود بيانات
        setTimeout(() => {
            ensureNotificationData();
            loadNotifications();
        }, 300);
        
        UI.updateAllBadges();

        // التحديث التلقائي كل 5 ثواني
        notificationInterval = setInterval(() => {
            loadNotifications();
            UI.updateAllBadges();
        }, 5000);
    });

    // ============================================================
    // 4. تحميل وعرض الإشعارات
    // ============================================================
    function loadNotifications() {
        const user = Auth.getCurrentUser();
        if (!user) return;

        const notifications = NotificationAPI.getByUser(user.id);
        const container = document.getElementById('notificationList');

        if (notifications.length === 0) {
            container.innerHTML = `
                <div class="p-8 text-center text-[#505f76]">
                    <span class="material-symbols-outlined text-[48px]">notifications_off</span>
                    <p class="mt-2">No notifications yet</p>
                </div>
            `;
            return;
        }

        container.innerHTML = '';
        notifications.forEach(notification => {
            const div = document.createElement('div');
            div.className = `notification-item ${notification.read ? '' : 'unread'} p-4 animate-fade-in`;
            div.dataset.notificationId = notification.id;

            const colors = {
                success: 'bg-[rgba(0,98,66,0.1)] text-[#006242]',
                error: 'bg-[rgba(186,26,26,0.1)] text-[#ba1a1a]',
                warning: 'bg-[rgba(241,196,15,0.1)] text-[#b7950b]',
                info: 'bg-[rgba(37,99,235,0.1)] text-[#004ac6]',
                message: 'bg-[rgba(37,99,235,0.1)] text-[#004ac6]'
            };

            const icons = {
                success: 'check_circle',
                error: 'error',
                warning: 'warning',
                info: 'notifications',
                message: 'chat'
            };

            const color = colors[notification.type] || colors.info;
            const icon = icons[notification.type] || 'notifications';

            div.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-12 h-12 shrink-0 rounded-full ${color} flex items-center justify-center">
                        <span class="material-symbols-outlined">${icon}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-2">
                            <h4 class="text-[16px] font-[600] leading-[24px] font-bold text-[#111c2d]">${notification.title}</h4>
                            <span class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] shrink-0">${UI.timeAgo(notification.timestamp)}</span>
                        </div>
                        <p class="text-[14px] font-[400] leading-[20px] text-[#505f76] mt-1">${notification.message}</p>
                        <div class="mt-3 flex items-center gap-4">
                            ${!notification.read ? `
                                <button class="text-[#004ac6] text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold hover:underline" onclick="markAsRead('${notification.id}')">Mark as Read</button>
                            ` : ''}
                            <button class="text-[#505f76] text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-medium hover:text-[#111c2d]" onclick="dismissNotification('${notification.id}')">Dismiss</button>
                            ${notification.type === 'message' ? `
                                <button class="text-[#004ac6] text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold hover:underline" onclick="window.location.href='chat.html'">Go to Chat</button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        // تحديث عدد الإشعارات غير المقروءة
        const unreadCount = notifications.filter(n => !n.read).length;
        const badge = document.querySelector('.notification-badge');
        if (badge) {
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
    }

    // ============================================================
    // 5. دوال التحكم في الإشعارات
    // ============================================================
    function markAsRead(id) {
        NotificationAPI.markAsRead(id);
        UI.updateNotificationBadge();
        loadNotifications();
    }

    function dismissNotification(id) {
        NotificationAPI.delete(id);
        UI.updateNotificationBadge();
        loadNotifications();
    }

    function markAllRead() {
        const user = Auth.getCurrentUser();
        if (!user) return;
        NotificationAPI.markAllAsRead(user.id);
        UI.updateNotificationBadge();
        loadNotifications();
        UI.showToast('All Read', 'All notifications marked as read.');
    }

    function clearAll() {
        const user = Auth.getCurrentUser();
        if (!user) return;
        if (confirm('Clear all notifications?')) {
            NotificationAPI.clearAll(user.id);
            UI.updateNotificationBadge();
            loadNotifications();
            UI.showToast('Cleared', 'All notifications cleared.');
        }
    }

    // ============================================================
    // 6. فلترة الإشعارات
    // ============================================================
    function filterNotifications(type) {
        const items = document.querySelectorAll('.notification-item');
        items.forEach(item => {
            if (type === 'all') {
                item.style.display = '';
            } else if (type === 'unread') {
                item.style.display = item.classList.contains('unread') ? '' : 'none';
            } else if (type === 'messages') {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes('message') || text.includes('chat') ? '' : 'none';
            }
        });

        // تحديث أزرار الفلتر
        document.querySelectorAll('.flex.gap-2 button').forEach(btn => {
            btn.classList.remove('bg-[#004ac6]', 'text-white');
            btn.classList.add('text-[#505f76]');
        });
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('bg-[#004ac6]', 'text-white');
            event.currentTarget.classList.remove('text-[#505f76]');
        }
    }

    // ============================================================
    // 7. البحث
    // ============================================================
    document.getElementById('notificationSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase();
        document.querySelectorAll('.notification-item').forEach(item => {
            if (item) {
                item.style.display = item.textContent.toLowerCase().includes(query) ? '' : 'none';
            }
        });
    });

    // ============================================================
    // 8. تنظيف عند الخروج
    // ============================================================
    window.addEventListener('beforeunload', function() {
        if (notificationInterval) {
            clearInterval(notificationInterval);
        }
    });
</script>
</body>
</html>
