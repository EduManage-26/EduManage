<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduManage - Chat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="icon" type="image/x-icon" href="../image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #f9f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .sidebar-link { transition: all 0.2s ease; cursor: pointer; }
        .sidebar-link:hover { background-color: #f0f3ff; transform: translateX(4px); }
        .sidebar-link.active { background-color: rgba(37,99,235,0.1); color: #004ac6; border-left: 4px solid #004ac6; font-weight: 700; }
        .card-shadow { box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .message-bubble { max-width: 80%; word-wrap: break-word; }
        .message-bubble.sent { background-color: #004ac6; color: white; border-radius: 18px 18px 4px 18px; }
        .message-bubble.received { background-color: #f0f3ff; color: #111c2d; border-radius: 18px 18px 18px 4px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .unread-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body class="bg-[#f9f9ff] text-[#111c2d]">

<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-full w-[260px] z-50 bg-[#f9f9ff] border-r border-[#c3c6d7] shadow-sm flex flex-col py-4 gap-1">
    <div class="px-4 mb-6">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-lg bg-[#2563eb] flex items-center justify-center text-white">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">admin_panel_settings</span>
            </div>
            <div>
                <h1 class="text-[20px] font-[600] leading-[28px] text-[#004ac6]">EduManage</h1>
                <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] profile-role">Super Admin</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 px-2 space-y-1 overflow-y-auto custom-scrollbar">
        <!-- Generated by SidebarManager -->
    </nav>
    <div class="px-4 mt-auto pt-4 border-t border-[#c3c6d7]">
        <div class="flex items-center gap-3">
            <img alt="Profile" class="w-10 h-10 rounded-full border border-[#c3c6d7] object-cover profile-avatar" src="https://ui-avatars.com/api/?name=User&background=004ac6&color=fff&size=128" />
            <div>
                <p class="text-[14px] font-[400] leading-[20px] font-bold profile-name text-[#111c2d]">Loading...</p>
                <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] profile-role text-[#505f76]">Super Admin</p>
            </div>
        </div>
    </div>
</aside>

<!-- Main Content -->
<main class="ml-[260px] min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 w-full h-16 bg-[#f9f9ff] border-b border-[#c3c6d7] shadow-sm flex justify-between items-center px-6">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative w-full max-w-md">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#737686]">search</span>
                <input class="w-full bg-[#f0f3ff] border-none rounded-full py-2 pl-10 pr-4 text-[14px] font-[400] leading-[20px] focus:ring-2 focus:ring-[#2563eb] focus:ring-opacity-20 transition-all" placeholder="Search conversations..." type="text" id="chatSearch" />
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="p-2 text-[#505f76] hover:bg-[#f0f3ff] rounded-full transition-colors relative" onclick="window.location.href='notifications.html'">
                <span class="material-symbols-outlined">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-[#ba1a1a] rounded-full notification-badge hidden"></span>
            </button>
            <div class="flex items-center gap-2 cursor-pointer hover:bg-[#f0f3ff] p-1 rounded-lg transition-colors" onclick="window.location.href='profile.html'">
                <img alt="Avatar" class="w-8 h-8 rounded-full object-cover profile-avatar" src="https://ui-avatars.com/api/?name=User&background=004ac6&color=fff&size=32" />
                <div class="hidden md:block text-left">
                    <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] font-bold leading-tight profile-name">Loading...</p>
                    <p class="text-[10px] text-[#505f76] profile-role">Super Admin</p>
                </div>
            </div>
        </div>
    </header>

    <div class="p-6 flex-1">
        <div class="bg-[#f9f9ff] rounded-xl border border-[#c3c6d7] card-shadow overflow-hidden h-[calc(100vh-220px)] flex">
            <!-- Contacts List -->
            <div class="w-full md:w-[340px] border-r border-[#c3c6d7] flex flex-col bg-[#f0f3ff]">
                <div class="p-3 border-b border-[#c3c6d7] bg-[#f9f9ff] flex items-center justify-between">
                    <h3 class="text-[14px] font-[600]">Messages</h3>
                    <button class="text-[12px] text-[#004ac6] font-bold hover:underline" onclick="toggleChatMode()">Community</button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar" id="contactsList">
                    <div class="p-4 text-center text-[#505f76]">Loading contacts...</div>
                </div>
            </div>

            <!-- Chat Window -->
            <div class="flex-1 flex flex-col bg-[#f9f9ff]">
                <div class="p-3 border-b border-[#c3c6d7] bg-[#f0f3ff] flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img id="chatAvatar" class="w-10 h-10 rounded-full object-cover" src="https://ui-avatars.com/api/?name=User&background=004ac6&color=fff&size=40" alt="Contact" />
                        <div>
                            <p class="text-[14px] font-[400] leading-[20px] font-bold" id="chatContactName">Select a contact</p>
                            <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76]" id="chatContactStatus">Online</p>
                        </div>
                    </div>
                    <button class="p-2 text-[#505f76] hover:bg-[#dee8ff] rounded-lg transition-colors" onclick="refreshChat()">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar" id="messagesContainer">
                    <div class="text-center text-[#505f76] py-8">Select a contact to start chatting</div>
                </div>

                <div class="border-t border-[#c3c6d7] bg-white p-4">
                    <div class="flex items-center gap-2">
                        <input id="messageInput" type="text" placeholder="Type a message..." class="flex-1 border border-[#c3c6d7] rounded-lg px-4 py-2 focus:outline-none focus:border-[#004ac6]" />
                        <button onclick="sendMessage()" class="bg-[#004ac6] text-white px-4 py-2 rounded-lg hover:bg-[#2563eb] transition">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 px-6 border-t border-[#c3c6d7] bg-[#f9f9ff]">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76]">© 2024 EduManage. All rights reserved.</p>
            <div class="flex gap-6">
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Help Center</a>
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Privacy Policy</a>
                <a class="text-[12px] font-[500] leading-[16px] tracking-[0.05em] text-[#505f76] hover:text-[#004ac6] transition-colors" href="#">Terms of Service</a>
            </div>
        </div>
    </footer>
</main>

<script src="../app.js"></script>
<script>
    let currentContactId = null;
    let isPublicChat = false;
    let refreshInterval = null;

    document.addEventListener('DOMContentLoaded', function() {
        const user = Auth.getCurrentUser();
        if (!user) {
            window.location.href = '../login.html';
            return;
        }

        // التأكد من وجود بيانات الشات
        if (typeof generateChatAndNotificationData === 'function') {
            setTimeout(() => {
                generateChatAndNotificationData();
                loadContacts();
            }, 300);
        }

        UI.loadUserProfile();
        
        // تحميل جهات الاتصال
        setTimeout(() => {
            loadContacts();
        }, 500);
        
        UI.updateAllBadges();

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        refreshInterval = setInterval(() => {
            if (currentContactId && !isPublicChat) {
                loadConversation(currentContactId);
            } else if (isPublicChat) {
                loadPublicMessages();
            }
            UI.updateAllBadges();
            updateUnreadBadges();
        }, 3000);

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                UI.updateAllBadges();
                if (currentContactId && !isPublicChat) {
                    loadConversation(currentContactId);
                }
                loadContacts();
            }
        });
    });

    // ============================================================
    // Update unread badges on contacts
    // ============================================================
    function updateUnreadBadges() {
        const user = Auth.getCurrentUser();
        if (!user) return;

        document.querySelectorAll('#contactsList .contact-item').forEach(item => {
            const contactId = item.dataset.contactId;
            if (contactId) {
                const unreadCount = ChatAPI.getUnreadCount(contactId);
                const badge = item.querySelector('.unread-badge');
                if (badge) {
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount;
                        badge.classList.remove('hidden');
                        badge.classList.add('animate-pulse');
                    } else {
                        badge.classList.add('hidden');
                        badge.classList.remove('animate-pulse');
                    }
                }
            }
        });
    }

    // ============================================================
    // Load Contacts
    // ============================================================
    function loadContacts() {
        const user = Auth.getCurrentUser();
        if (!user) return;
        
        const contacts = ChatAPI.getAllContacts(user.id);
        const container = document.getElementById('contactsList');

        if (contacts.length === 0) {
            container.innerHTML = `
                <div class="p-4 text-center text-[#505f76]">
                    <span class="material-symbols-outlined text-[48px]">chat</span>
                    <p class="mt-2">No contacts yet.</p>
                    <p class="text-[12px]">Start a conversation!</p>
                </div>
            `;
            return;
        }

        container.innerHTML = '';
        contacts.forEach(contact => {
            const lastMsg = ChatAPI.getConversation(user.id, contact.id);
            const last = lastMsg.length > 0 ? lastMsg[lastMsg.length - 1] : null;
            const unreadCount = ChatAPI.getUnreadCount(contact.id);

            const div = document.createElement('div');
            div.className = 'contact-item p-3 border-b border-[#c3c6d7] cursor-pointer hover:bg-[#f0f3ff] transition-colors flex items-center gap-3';
            div.dataset.contactId = contact.id;
            div.onclick = () => {
                loadConversation(contact.id);
                const unreadMessages = ChatAPI.getConversation(user.id, contact.id)
                    .filter(m => m.receiverId === user.id && !m.read);
                unreadMessages.forEach(m => ChatAPI.markAsRead(m.id));
                UI.updateChatBadge();
                updateUnreadBadges();
                loadContacts();
            };

            const avatarUrl = contact.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(contact.name)}&background=004ac6&color=fff&size=40`;
            
            div.innerHTML = `
                <img src="${avatarUrl}" class="w-10 h-10 rounded-full object-cover" alt="${contact.name}" />
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between">
                        <p class="text-[14px] font-[400] leading-[20px] font-bold truncate">${contact.name}</p>
                        <span class="text-[10px] text-[#505f76]">${last ? UI.formatTime(last.timestamp) : ''}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-[12px] text-[#505f76] truncate">${last ? (last.senderId === user.id ? 'You: ' : '') + last.message : 'No messages yet'}</p>
                        ${unreadCount > 0 ? `<span class="unread-badge bg-[#ba1a1a] text-white text-[10px] px-1.5 py-0.5 rounded-full">${unreadCount}</span>` : ''}
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // ============================================================
    // Load Conversation
    // ============================================================
    function loadConversation(contactId) {
        const user = Auth.getCurrentUser();
        if (!user) return;
        
        currentContactId = contactId;
        isPublicChat = false;
        const contact = Auth.getUserById(contactId);

        if (!contact) return;

        const avatarUrl = contact.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(contact.name)}&background=004ac6&color=fff&size=40`;
        document.getElementById('chatAvatar').src = avatarUrl;
        document.getElementById('chatContactName').textContent = contact.name;
        document.getElementById('chatContactStatus').textContent = contact.role.charAt(0).toUpperCase() + contact.role.slice(1);

        const messages = ChatAPI.getConversation(user.id, contactId);
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        if (messages.length === 0) {
            container.innerHTML = `<div class="text-center text-[#505f76] py-8">No messages yet. Say hello!</div>`;
            return;
        }

        messages.forEach(msg => {
            const isMine = msg.senderId === user.id;
            const sender = Auth.getUserById(msg.senderId);
            const senderAvatar = sender?.avatar || `https://ui-avatars.com/api/?name=${sender?.name || 'User'}&background=004ac6&color=fff&size=32`;
            
            const div = document.createElement('div');
            div.className = `flex items-start gap-2 ${isMine ? 'justify-end' : ''} animate-fade-in`;
            div.innerHTML = `
                ${!isMine ? `<img src="${senderAvatar}" class="w-8 h-8 rounded-full object-cover" alt="${sender?.name}" />` : ''}
                <div class="message-bubble ${isMine ? 'sent' : 'received'} p-3 max-w-[75%]">
                    ${!isMine ? `<p class="text-[11px] font-bold text-[#004ac6]">${sender?.name}</p>` : ''}
                    <p>${msg.message}</p>
                    <span class="text-[10px] ${isMine ? 'text-[rgba(255,255,255,0.7)]' : 'text-[#505f76]'} block mt-1">${UI.formatTime(msg.timestamp)}</span>
                </div>
            `;
            container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;

        // Mark messages as read
        const unreadMessages = messages.filter(m => m.receiverId === user.id && !m.read);
        unreadMessages.forEach(m => ChatAPI.markAsRead(m.id));
        UI.updateChatBadge();
        updateUnreadBadges();
        loadContacts();
    }

    // ============================================================
    // Send Message
    // ============================================================
    function sendMessage() {
        const user = Auth.getCurrentUser();
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (!message) return;

        if (isPublicChat) {
            ChatAPI.sendPublic(user.id, message);
            input.value = '';
            loadPublicMessages();
            UI.updateAllBadges();
            return;
        }

        if (currentContactId) {
            ChatAPI.sendMessage(user.id, currentContactId, message);
            input.value = '';
            loadConversation(currentContactId);
            UI.showToast('Message Sent', 'Your message has been sent.');
            setTimeout(() => {
                UI.updateAllBadges();
                updateUnreadBadges();
                loadContacts();
            }, 500);
        } else {
            UI.showToast('Error', 'Please select a contact first.', 'error');
        }
    }

    // ============================================================
    // Public Chat
    // ============================================================
    function toggleChatMode() {
        isPublicChat = !isPublicChat;
        const container = document.getElementById('messagesContainer');
        const name = document.getElementById('chatContactName');
        const status = document.getElementById('chatContactStatus');

        if (isPublicChat) {
            name.textContent = 'Community Chat';
            status.textContent = 'All Users';
            document.getElementById('chatAvatar').src = 'https://ui-avatars.com/api/?name=Community&background=004ac6&color=fff&size=40';
            loadPublicMessages();
        } else {
            loadContacts();
            container.innerHTML = `<div class="text-center text-[#505f76] py-8">Select a contact to start chatting</div>`;
            name.textContent = 'Select a contact';
            status.textContent = 'Online';
        }
    }

    // ============================================================
    // Load Public Messages
    // ============================================================
    function loadPublicMessages() {
        const messages = ChatAPI.getPublicMessages();
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        if (messages.length === 0) {
            container.innerHTML = `<div class="text-center text-[#505f76] py-8">No public messages yet. Start the conversation!</div>`;
            return;
        }

        const user = Auth.getCurrentUser();
        messages.forEach(msg => {
            const sender = Auth.getUserById(msg.senderId);
            const isMine = msg.senderId === user.id;
            const senderAvatar = sender?.avatar || `https://ui-avatars.com/api/?name=${sender?.name || 'User'}&background=004ac6&color=fff&size=32`;
            
            const div = document.createElement('div');
            div.className = `flex items-start gap-2 ${isMine ? 'justify-end' : ''} animate-fade-in`;
            div.innerHTML = `
                ${!isMine ? `<img src="${senderAvatar}" class="w-8 h-8 rounded-full object-cover" alt="${sender?.name}" />` : ''}
                <div class="message-bubble ${isMine ? 'sent' : 'received'} p-3 max-w-[75%]">
                    ${!isMine ? `<p class="text-[11px] font-bold text-[#004ac6]">${sender?.name || 'Unknown'}</p>` : ''}
                    <p>${msg.message}</p>
                    <span class="text-[10px] ${isMine ? 'text-[rgba(255,255,255,0.7)]' : 'text-[#505f76]'} block mt-1">${UI.formatTime(msg.timestamp)}</span>
                </div>
            `;
            container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;
    }

    // ============================================================
    // Refresh Chat
    // ============================================================
    function refreshChat() {
        if (currentContactId && !isPublicChat) {
            loadConversation(currentContactId);
        } else if (isPublicChat) {
            loadPublicMessages();
        }
        UI.updateAllBadges();
        updateUnreadBadges();
        loadContacts();
        UI.showToast('Refreshed', 'Chat has been refreshed.');
    }

    // ============================================================
    // Search
    // ============================================================
    document.getElementById('chatSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase();
        document.querySelectorAll('#contactsList .contact-item').forEach(el => {
            if (el) {
                el.style.display = el.textContent.toLowerCase().includes(query) ? '' : 'none';
            }
        });
    });

    // ============================================================
    // Cleanup
    // ============================================================
    window.addEventListener('beforeunload', function() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
        }
    });
</script>
</body>
</html>
